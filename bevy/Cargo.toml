[package]
name        = "phantasia-bevy"
version     = "0.1.0"
edition     = "2021"
description = "Phantasia – Bevy port (prototype)"

[[bin]]
name = "phantasia"
path = "src/main.rs"

[dependencies]
bevy        = { version = "0.15", features = ["dynamic_linking"] }
serde       = { version = "1",    features = ["derive"] }
serde_json  = "1"
noise       = "0.9"
hashbrown   = "0.15"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
